name: "CI"

on:
    # Lint & Test runs on every PR (feature -> main and main -> production).
    # The image build keys off the push event Gitea emits when a main -> production
    # PR merges (nobody pushes to these branches directly - both are PR-only, and
    # production only advances by a fast-forward release PR). main is the integration
    # branch and never produces a prod artifact.
    pull_request:
    push:
        branches:
            - production

env:
    fail-fast: true

permissions:
    contents: read

jobs:
    ci:
        name: Lint & Test
        # PRs only. main -> production is fast-forward, so the production HEAD is
        # a commit this already passed on its PR - no point re-running it on the
        # push that triggers the build.
        if: gitea.event_name == 'pull_request'
        runs-on: default
        container:
            image: dunglas/frankenphp:1-php8.5

        services:
            postgres:
                image: postgres:16-alpine
                env:
                    POSTGRES_USER: app
                    POSTGRES_PASSWORD: "!ChangeMe!"
                    POSTGRES_DB: app
                options: >-
                    --health-cmd pg_isready
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5

        env:
            # Reach the postgres service by name; the test bootstrap derives the
            # app_test database from this via doctrine's dbname_suffix.
            DATABASE_URL: "postgresql://app:!ChangeMe!@postgres:5432/app?serverVersion=16&charset=utf8"
            COMPOSER_ALLOW_SUPERUSER: 1
            # Panther browser tests (#85): the container runs as root with a small
            # /dev/shm, so Chromium needs --no-sandbox + --disable-dev-shm-usage.
            # PANTHER_APP_ENV=test lives in .env.test so the spawned server shares app_test.
            PANTHER_NO_SANDBOX: 1
            PANTHER_CHROME_ARGUMENTS: "--disable-dev-shm-usage"

        steps:
            - name: "Install git and nodejs for Gitea Actions runtime"
              run: |
                  apt-get update
                  apt-get install -y --no-install-recommends git nodejs

            - name: "Checkout code"
              uses: actions/checkout@v5

            # JS toolchain (#133). Node-only dev/CI tooling - nothing is bundled or
            # shipped to the browser; AssetMapper + importmap remain the runtime.
            - name: "Set up Node.js"
              uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: npm

            - name: "Install JS dependencies"
              id: npm
              run: npm ci

            - name: "Install OS packages and PHP extensions"
              # Chromium (+ driver) for the Panther browser tests, matching the Dockerfile.
              # This was pinned to a last-known-good build because chromium 150.x crashed on launch
              # with SIGTRAP on arm64 - a browser subprocess dies before a session is created. But
              # trixie garbage-collects superseded builds, so an exact version pin eventually vanishes
              # from apt and breaks every run. If the arm64 launch crash recurs, pin via
              # snapshot.debian.org (an immutable archive) rather than a live, GC-able version.
              run: |
                  apt-get install -y --no-install-recommends file ca-certificates \
                      chromium chromium-driver
                  install-php-extensions @composer intl mbstring zip pdo_pgsql pcov

            - name: "Validate Composer config"
              run: composer validate --no-check-publish --strict

            - name: "Install dependencies"
              id: install
              run: composer install --ansi --no-interaction --no-progress --prefer-dist

            # Code style checks
            - name: "PHP-CS-Fixer"
              if: always() && steps.install.outcome == 'success'
              run: vendor/bin/php-cs-fixer check --diff --using-cache=no

            - name: "Twig-CS-Fixer"
              if: always() && steps.install.outcome == 'success'
              run: vendor/bin/twig-cs-fixer check --ansi -v

            # Linters
            - name: "Lint YAML files"
              if: always() && steps.install.outcome == 'success'
              run: php bin/console lint:yaml config --parse-tags

            - name: "Lint Twig templates"
              if: always() && steps.install.outcome == 'success'
              run: php bin/console lint:twig templates --env=prod

            - name: "Lint XLIFF translation files"
              if: always() && steps.install.outcome == 'success'
              run: php bin/console lint:xliff translations

            - name: "Lint translation contents"
              if: always() && steps.install.outcome == 'success'
              run: php bin/console lint:translations

            - name: "Lint Parameters and Services"
              if: always() && steps.install.outcome == 'success'
              run: php bin/console lint:container --no-debug

            # The container entrypoint's contract: a failed migration stops the boot, and only the
            # migration owner migrates. Pure shell against stub binaries, so unlike the production
            # compose contract (which needs a Docker socket this job does not have) it runs here.
            - name: "Container entrypoint contract"
              if: always()
              run: ./bin/entrypoint-check

            - name: "Lint Doctrine entities"
              if: always() && steps.install.outcome == 'success'
              run: php bin/console doctrine:schema:validate --skip-sync -vvv --no-interaction

            - name: "Check for compromised dependencies"
              if: always() && steps.install.outcome == 'success'
              run: composer audit

            # Static analysis
            - name: "PHPStan"
              if: always() && steps.install.outcome == 'success'
              # The FrankenPHP image caps memory_limit at 128M; PHPStan needs more.
              run: vendor/bin/phpstan analyze --memory-limit=4G --no-progress --error-format=github

            # Static analysis of tests/ (relaxed profile; lights up phpstan-phpunit).
            - name: "PHPStan (tests)"
              if: always() && steps.install.outcome == 'success'
              run: vendor/bin/phpstan analyze -c phpstan-tests.neon --memory-limit=4G --no-progress --error-format=github

            # Worker-mode state audit: fails the build if a shared service would leak state across
            # requests under FrankenPHP worker mode. Needs the dev service map, which the IgorPhpBundle
            # CompilerPass writes on cache:clear. The Go binary self-downloads on first run.
            - name: "Igor (worker-mode state audit)"
              if: always() && steps.install.outcome == 'success'
              run: |
                  php bin/console cache:clear --env=dev
                  vendor/bin/igor-php .

            # JS toolchain checks (#133) - Biome (style + lint), tsc --checkJs (static
            # analysis), Vitest (unit tests). Independent of the PHP stack above.
            - name: "Biome (JS code style + lint)"
              if: always() && steps.npm.outcome == 'success'
              run: npm run cs:check

            - name: "tsc --checkJs (JS static analysis)"
              if: always() && steps.npm.outcome == 'success'
              run: npm run sa

            - name: "Vitest (JS unit tests)"
              if: always() && steps.npm.outcome == 'success'
              run: npm run test

            # Refactor drift: the tree must already satisfy the configured Rector rules.
            - name: "Rector (dry-run)"
              if: always() && steps.install.outcome == 'success'
              run: vendor/bin/rector --dry-run --no-progress-bar

            # Tests
            - name: "Build and compile assets"
              if: always() && steps.install.outcome == 'success'
              run: |
                  php bin/console importmap:install
                  php bin/console tailwind:build
                  php bin/console asset-map:compile

            - name: "PHPUnit"
              if: always() && steps.install.outcome == 'success'
              # The FrankenPHP image caps memory_limit at 128M; a coverage run over the full suite
              # (PCOV instrumentation + the dom-crawler feature tests) needs more headroom.
              # PHPUnit has no native --min; bin/coverage-min.php enforces 70% from the Clover report.
              run: |
                  php -d memory_limit=512M vendor/bin/phpunit --coverage-clover var/coverage.xml
                  php bin/coverage-min.php var/coverage.xml 70

    build:
        name: Build Docker Image
        # Native amd64 build on the Hex runner (no QEMU emulation). Deploy target
        # is Hex (x86_64) only; if an arm64 host enters the picture later, add a
        # matrix leg on the arm64 runner and a manifest-merge job (see #259).
        runs-on: amd64
        # Only on a release: push to production (a merged main -> production PR),
        # never off main. No needs/re-run of Lint & Test - the PR that merged into
        # production already passed it on the PR.
        if: gitea.event_name == 'push' && gitea.ref == 'refs/heads/production'

        env:
            REGISTRY: code.dev88.work
            IMAGE: code.dev88.work/dev88/obol

        steps:
            - name: "Checkout code"
              uses: actions/checkout@v5

            - name: "Set up Docker Buildx"
              uses: docker/setup-buildx-action@v3

            - name: "Set short SHA"
              run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> $GITHUB_ENV

            - name: "Login to Gitea Container Registry"
              uses: docker/login-action@v3
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ gitea.repository_owner }}
                  password: ${{ secrets.REGISTRY_TOKEN }}

            - name: "Build and push Docker image"
              uses: docker/build-push-action@v6
              with:
                  context: .
                  # Pin the prod stage explicitly. It is the Dockerfile's last stage, so
                  # an unset target resolves to it today - but that breaks silently the
                  # moment a stage is appended. Naming it keeps the shipped image hardened.
                  target: frankenphp_prod
                  # amd64 only - built natively on the Hex runner, the sole deploy
                  # target (x86_64). No QEMU, no multi-arch manifest.
                  platforms: linux/amd64
                  # No unknown/unknown attestation entries in Gitea's package view.
                  provenance: false
                  push: true
                  tags: |
                      ${{ env.IMAGE }}:latest
                      ${{ env.IMAGE }}:${{ env.SHORT_SHA }}
