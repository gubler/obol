---
# Development environment override — always loaded by default.
# Port publishing and proxy routing live in compose.solo.yaml / compose.shared.yaml;
# bin/dc auto-picks the right one based on whether the lolly network is present.
services:
  php:
    image: ${IMAGES_PREFIX:-}obol-php-dev
    build:
      context: .
      target: frankenphp_dev
    volumes:
      - ./:/app
      - ./frankenphp/Caddyfile:/etc/frankenphp/Caddyfile:ro
      - ./frankenphp/conf.d/20-app.dev.ini:/usr/local/etc/php/app.conf.d/20-app.dev.ini:ro
      # Share the compiled Tailwind CSS with the watcher sidecar (#188). The image declares
      # VOLUME /app/var, so without an explicit shared volume each container gets its own
      # var/tailwind and php would never see the sidecar's builds.
      - tailwind_build:/app/var/tailwind
      # Solo mode publishes plain HTTP on loopback; browser-trusted TLS comes
      # from Lolly in shared mode. No per-app cert mount needed.
      # If you develop on Mac or Windows you can remove the vendor/ directory
      # from the bind-mount for better performance by enabling the next line:
      #- /app/vendor
    environment:
      # Scope the worker's file watcher to the source dirs a reload actually needs. A bare `watch`
      # defaults to `./**/*.{env,php,twig,yaml,yml}` under /app, which includes var/cache - so a
      # Symfony dev-cache rebuild (cache:clear, or a lazy rebuild after a config/source edit) rewrites
      # ~2000 container files at once and storms the watcher into a reload loop that wedges the worker
      # (HTTP stops responding). Watching only src/config/templates/translations keeps hot-reload while
      # breaking that var/cache feedback loop.
      FRANKENPHP_WORKER_CONFIG: |
        watch /app/src
        watch /app/config
        watch /app/templates
        watch /app/translations
      FRANKENPHP_SITE_CONFIG: hot_reload
      # The Mercure hub is dev-only: it powers FrankenPHP's hot_reload (which refuses to boot
      # without a configured hub) and the demo debugger UI. Injecting it here via
      # CADDY_SERVER_EXTRA_DIRECTIVES keeps it out of the shared Caddyfile, so prod never mounts a
      # public hub. The JWT keys are dev-only too; the *_ALG vars default from the base image.
      # Why prod has no hub, and the criteria for bringing one back: reference/adr/0023.
      MERCURE_PUBLISHER_JWT_KEY: "!ChangeThisMercureHubJWTSecretKey!"
      MERCURE_SUBSCRIBER_JWT_KEY: "!ChangeThisMercureHubJWTSecretKey!"
      CADDY_SERVER_EXTRA_DIRECTIVES: |
        mercure {
          publisher_jwt {env.MERCURE_PUBLISHER_JWT_KEY} {env.MERCURE_PUBLISHER_JWT_ALG}
          subscriber_jwt {env.MERCURE_SUBSCRIBER_JWT_KEY} {env.MERCURE_SUBSCRIBER_JWT_ALG}
          anonymous
          subscriptions
          demo
        }
      # See https://xdebug.org/docs/all_settings#mode
      XDEBUG_MODE: "${XDEBUG_MODE:-develop}"
      APP_ENV: "${APP_ENV:-dev}"
    extra_hosts:
      # Ensure that host.docker.internal is correctly defined on Linux
      - host.docker.internal:host-gateway
    tty: true

  # Dev worker: same image as the dev php (built by the php service), with the source bind-mounted
  # so it picks up local changes. It waits for php to be healthy (base compose), so vendor is
  # installed before it boots.
  worker:
    image: ${IMAGES_PREFIX:-}obol-php-dev
    volumes:
      - ./:/app
    environment:
      APP_ENV: "${APP_ENV:-dev}"

  # Dev-only Tailwind watcher (#188): same dev image as php, source bind-mounted so it sees
  # template/CSS edits, sharing the tailwind_build volume with php so the var/tailwind/app.built.css
  # it writes is the file php serves. Runs `tailwind:build --watch`; the standalone Tailwind v4 binary
  # has no `--poll` flag. Waits for php healthy so vendor is installed first (like the worker).
  # Dev-only - never present in compose.prod.yaml.
  tailwind:
    image: ${IMAGES_PREFIX:-}obol-php-dev
    # Skip the app entrypoint's DB-wait + migrations (docker-entrypoint.sh runs them for any
    # php/bin/console command). This is a CSS builder that never touches the database; run straight
    # through the base PHP entrypoint to the watch command.
    entrypoint: ["docker-php-entrypoint"]
    command: php bin/console tailwind:build --watch
    # The image healthcheck probes Caddy's admin endpoint, which this command does not serve.
    healthcheck:
      disable: true
    volumes:
      - ./:/app
      - tailwind_build:/app/var/tailwind
    environment:
      APP_ENV: "${APP_ENV:-dev}"
    depends_on:
      php:
        condition: service_healthy
###> symfony/mercure-bundle ###
###< symfony/mercure-bundle ###
###> doctrine/doctrine-bundle ###
  database:
    # Default publishes 5432 to host. Set POSTGRES_HOST_PORT in .env.local to
    # avoid collisions when a sibling app (or a host-installed Postgres) is
    # already on 5432 — bin/dc picks up .env.local via --env-file.
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
###< doctrine/doctrine-bundle ###

# Named volume shared between php and the tailwind watcher so the compiled CSS the sidecar writes
# (var/tailwind/app.built.css) is the file php serves (#188).
volumes:
  tailwind_build:
