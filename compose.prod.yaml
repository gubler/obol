---
# Production environment override.
#
# Required values use the ${VAR:?msg} form: an unset one aborts the whole `docker compose` command at
# interpolation time, so a forgotten secret fails the deploy loudly instead of silently falling back
# to a repo-known dev default. That only holds when the interpolation environment is a deploy-owned
# env file - Compose otherwise reads the checkout's `.env`, whose committed defaults would satisfy
# these guards. bin/dc-prod pins both the file chain and the env file; use it rather than assembling
# `docker compose` invocations by hand.

# Everything origin-shaped derives from APP_HOST, the application's public identity: what users type,
# what appears in magic-link emails, and what passkeys bind to. It is deliberately NOT SERVER_NAME,
# which is a Caddy directive naming the address to listen on. The two coincided in development and
# stop coinciding behind a tunnel, where TLS terminates upstream and Caddy listens on plain HTTP.
#
# Carried by php and worker alike: the worker is where magic-link and verification URLs are actually
# minted, and where mail is actually sent, so it needs the same origin and mail configuration the web
# container has.
x-app-environment: &app_environment
  # Signs magic links, remember-me cookies, and email-verification URIs - a known value is a full
  # auth compromise.
  APP_SECRET: ${APP_SECRET:?APP_SECRET must be set in production}
  # Magic links are the only way into the application, so a silently dropped send is a lockout. There
  # is deliberately no fallback; php ships app:mailer:smoke, so a deploy can be proven.
  MAILER_DSN: ${MAILER_DSN:?MAILER_DSN must be set in production}
  MAILER_FROM: ${MAILER_FROM:?MAILER_FROM must be set in production}
  # Origin for absolute URLs built off-request (CLI and worker), where there is no request to derive
  # a host from. Derived from APP_HOST rather than SERVER_NAME, which behind a tunnel is `:80` and
  # would produce `https://:80`.
  DEFAULT_URI: https://${APP_HOST:?APP_HOST must be set in production}
  # The relying party passkeys bind to, permanently - a credential cannot be rebound after
  # registration. Pinned to the registrable apex rather than a host, so passkeys survive the
  # application later moving onto a subdomain (reference/adr/0018). APP_HOST is that apex, so it
  # supplies the default; the override exists only so the apex can be held fixed if the application
  # host ever stops being the apex. This is the one value here that cannot be corrected afterwards.
  WEBAUTHN_RP_ID: ${WEBAUTHN_RP_ID:-${APP_HOST:?APP_HOST must be set in production}}
  # The exact origin browsers send during a ceremony (scheme + host + port).
  WEBAUTHN_ALLOWED_ORIGINS: https://${APP_HOST:?APP_HOST must be set in production}

# Container output goes to the host's systemd journal rather than to json files under the container
# id. That is one driver for two separate problems: the host's disk is shared with the PostgreSQL
# volume, so unbounded logs are an outage rather than an annoyance and present as a full disk that
# looks nothing like "logs got large"; and json-file logs are deleted along with the container, which
# discards them on exactly the event - a recreate - you most want to read them after. The journal
# lives on the host, so it survives that, and `docker logs` still answers from it.
#
# Deliberately not in the base compose, which would otherwise be the tidier home for one rule. The
# driver needs systemd on the *daemon* host, and Docker Desktop and OrbStack both run the daemon
# inside a VM that has none, so a development stack would refuse to start rather than merely log
# somewhere else. Development stays on the daemon default, where frequent image churn keeps logs from
# accumulating in the first place.
#
# The size bound is host configuration rather than anything in this file: journald has no
# per-container cap, so `SystemMaxUse` and `SystemKeepFree` in /etc/systemd/journald.conf are what
# actually keep the disk safe, and they belong to host provisioning. Its default rate limit also
# *drops* messages past a burst rather than queuing them, which the worker's steady output can reach.
# Both are covered in the deployment documentation; the decision itself is reference/adr/0027.
x-logging: &logging
  driver: journald

services:
  php:
    # A single reference the deploy pins to a released tag, so a rollback is one line in the deploy
    # env plus `bin/dc-prod up -d`. Required rather than defaulted: a floating tag would let an
    # unrelated restart pull something unreviewed, the same hazard the connector's pinned tag avoids.
    image: ${OBOL_IMAGE:?OBOL_IMAGE must be set in production}
    build:
      context: .
      target: frankenphp_prod
    environment:
      <<: *app_environment
      # Caddy's listen address, nothing more. TLS terminates at Cloudflare and the connector reaches
      # this container over plain HTTP on the stack's internal network, so there is no certificate to
      # fetch and no public hostname to bind here.
      #
      # This is also why the production stack mounts no volume for Caddy's state: with nothing to
      # issue, /data holds nothing worth keeping. Point this at a public hostname and automatic HTTPS
      # starts - at which case a missing /data means re-issuing certificates on every container
      # recreate, straight into Let's Encrypt's rate limits. Restore the volume before doing that.
      SERVER_NAME: ":80"
    logging: *logging

  # Same prod image as php. DATABASE_URL comes from the base compose anchor; depends_on (php healthy)
  # from base too. It carries the full application environment because async dispatch routes the real
  # send and the real URL generation through this container, not the web request.
  worker:
    image: ${OBOL_IMAGE:?OBOL_IMAGE must be set in production}
    environment: *app_environment
    # The service most likely to produce steady volume, since it logs every scheduler tick and every
    # message handled - so it is the one the journal's rate limit is most likely to drop from.
    logging: *logging

  ###> doctrine/doctrine-bundle ###
  database:
    environment:
      # The cluster's bootstrap superuser. It provisions the two roles below and is then used by
      # nothing - not the application, not the migrations - so this password's job is to be the
      # break-glass credential and the one a restore runs under.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in production}
      # The two roles the application actually connects as (reference/adr/0030). Guarded here rather
      # than where the DSNs are assembled, because Compose evaluates every file in the chain before
      # starting anything: an unset password aborts the command outright, so the base compose never
      # gets to fall back to its repo-known development default and quietly ship it to production.
      OBOL_DB_OWNER_PASSWORD: ${OBOL_DB_OWNER_PASSWORD:?OBOL_DB_OWNER_PASSWORD must be set in production}
      OBOL_DB_RUNTIME_PASSWORD: ${OBOL_DB_RUNTIME_PASSWORD:?OBOL_DB_RUNTIME_PASSWORD must be set in production}
    volumes:
      # A named volume rather than the base compose's checkout-relative bind mount: the database must
      # not be tied to the deploy checkout's working directory, where re-cloning or moving the
      # checkout would strand it. Compose merges service volumes by mount target, so this replaces
      # the base entry instead of adding a second mount at the same path.
      - database_data:/var/lib/postgresql/data
    logging: *logging
  ###< doctrine/doctrine-bundle ###

volumes:
  database_data:
