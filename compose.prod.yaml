---
# Production environment override
services:
  php:
    image: ${IMAGES_PREFIX:-}obol-php-prod
    build:
      context: .
      target: frankenphp_prod
    environment:
      # Required secrets use the ${VAR:?msg} form: an unset var aborts the whole `docker compose`
      # command at interpolation time, so a forgotten secret fails the deploy loudly instead of
      # silently falling back to the repo-known weak default in the base compose. APP_SECRET signs
      # magic links, remember-me cookies, and email-verification URIs - a known value is a full auth
      # compromise.
      APP_SECRET: ${APP_SECRET:?APP_SECRET must be set in production}
      # Transactional mail (magic-link/signup). The base compose sets no MAILER_DSN, so
      # without this prod would inherit the dev `.env` null:// default and silently drop every
      # send. php runs app:mailer:smoke; verify a deploy with it. Sourced from the host deploy env.
      MAILER_DSN: ${MAILER_DSN}
      # Origin for off-request absolute URLs (magic-link/verification links). Required, derived from
      # the same SERVER_NAME the deploy already sets for serving, so an unset origin aborts the deploy
      # rather than shipping http://localhost links in email.
      DEFAULT_URI: https://${SERVER_NAME:?SERVER_NAME must be set in production}

  # Prod worker: same prod image as php (built by the php service), plus the app secret the kernel
  # needs. DATABASE_URL comes from the base compose anchor; depends_on (php healthy) from base too.
  # Carries MAILER_DSN too: async mail dispatch routes the actual SMTP send through this worker,
  # not the web request, so it needs the mailer env just as much as the php container.
  worker:
    image: ${IMAGES_PREFIX:-}obol-php-prod
    environment:
      APP_SECRET: ${APP_SECRET:?APP_SECRET must be set in production}
      MAILER_DSN: ${MAILER_DSN}
      # The worker is where magic-link/verification URLs are actually generated, so DEFAULT_URI
      # matters here most of all. Same required contract as php above.
      DEFAULT_URI: https://${SERVER_NAME:?SERVER_NAME must be set in production}

  # Require the database password from the host env rather than letting the base compose fall back to
  # the repo-known !ChangeMe! default. This single required reference also gates DATABASE_URL, which
  # the base compose builds from POSTGRES_PASSWORD - so an unset password aborts the deploy before
  # anything starts, and a set one flows through to the app's connection string unchanged.
  database:
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in production}
