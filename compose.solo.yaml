---
# Solo mode — no Lolly proxy. Publishes the container's plain HTTP on loopback
# (per Lolly's stack-agnostic solo template) for a quick "is it alive" check.
# Browser-trusted TLS is owned by Lolly — start Lolly to get https://obol.lolly.localhost.
services:
  php:
    ports:
      - "127.0.0.1:${SOLO_HTTP_PORT:-8080}:80"
