---
# Two connection strings, because there are two database roles (reference/adr/0030). The runtime one
# is what the entire application runs on and it cannot change the schema; the migration one owns it.
# Both are assembled from the parts by default, so the local stack needs no configuration.
#
# The *_OVERRIDE variables supply complete DSNs instead, for pointing the application at a database
# outside this stack. Named `_OVERRIDE` rather than DATABASE_URL on purpose: the committed `.env`
# defines DATABASE_URL as a host-side 127.0.0.1 DSN for tooling run outside Docker, and reusing that
# name here would inject an unreachable address into the container the moment Compose read that file.
#
# Note whose credentials each carries. POSTGRES_USER is the cluster's bootstrap superuser and appears
# in neither: it provisions the two roles and is then done, so a compromised application container
# holds no credential that can reach outside this database.
x-database-url: &database_url ${DATABASE_URL_OVERRIDE:-postgresql://${OBOL_DB_RUNTIME:-obol_app}:${OBOL_DB_RUNTIME_PASSWORD:-!ChangeMe!}@database:5432/${POSTGRES_DB:-app}?serverVersion=${POSTGRES_VERSION:-16}&charset=${POSTGRES_CHARSET:-utf8}}
x-migration-database-url: &migration_database_url ${MIGRATION_DATABASE_URL_OVERRIDE:-postgresql://${OBOL_DB_OWNER:-obol_owner}:${OBOL_DB_OWNER_PASSWORD:-!ChangeMe!}@database:5432/${POSTGRES_DB:-app}?serverVersion=${POSTGRES_VERSION:-16}&charset=${POSTGRES_CHARSET:-utf8}}

services:
  php:
    image: ${IMAGES_PREFIX:-}obol-php
    restart: unless-stopped
    environment:
      SERVER_NAME: ${SERVER_NAME:-obol.lolly.localhost}, php:80
      DATABASE_URL: *database_url
      # Carried by every container that runs bin/console, not just the migrator: the entrypoint has
      # each of them verify the schema is current, and a migration run by hand has to find the owner
      # role wherever it is invoked from.
      MIGRATION_DATABASE_URL: *migration_database_url
      # The one container that migrates. Every container built from this image runs the same
      # entrypoint, which migrates only when told to and otherwise just verifies the schema is
      # current, so this single line is what makes the ownership exclusive rather than a race the
      # dependency graph happens to serialize. php is the right owner because it is the container
      # the rest of the stack already gates on.
      OBOL_RUN_MIGRATIONS: "1"
    # Deliberately no volumes. Everything that has to outlive a container lives in PostgreSQL
    # (reference/adr/0026), so the database's is the only mount production has and a host move is a
    # dump and restore rather than a hand-copied set of volumes. The development stack's own mounts
    # are in compose.dev.yaml: a volume declared here could not be removed by an overlay, since
    # Compose merges service volumes by mount target rather than replacing the list.
    depends_on:
      database:
        condition: service_healthy

  # Long-running Messenger consumer. Drains three transports in priority order so mail drains
  # first: `mail` (outbound transactional email), `async` (general off-request work,
  # empty for now), and `scheduler_default` (the Symfony Scheduler transport - without it the
  # daily GeneratePayments schedule never fires). Same image as php, different command; it waits
  # for php to be healthy so vendor install and migrations (run by php's entrypoint) are already
  # done, which makes its own entrypoint setup a no-op.
  worker:
    image: ${IMAGES_PREFIX:-}obol-php
    restart: unless-stopped
    command: php bin/console messenger:consume mail async scheduler_default --time-limit=3600
    # The image healthcheck probes the application over HTTP, which this command does not serve - it
    # consumes a queue and answers nothing. Its liveness is that the process is running.
    healthcheck:
      disable: true
    # Deliberately no OBOL_RUN_MIGRATIONS: php owns migrations, and a container that says nothing
    # does not migrate. The entrypoint still makes this container verify the schema is current and
    # refuse to start if it is not, so it does not simply trust that php's migration worked.
    environment:
      DATABASE_URL: *database_url
      MIGRATION_DATABASE_URL: *migration_database_url
    depends_on:
      database:
        condition: service_healthy
      php:
        condition: service_healthy

  ###> doctrine/doctrine-bundle ###
  database:
    image: postgres:${POSTGRES_VERSION:-16}-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-app}
      # The cluster's bootstrap superuser, created by initdb. It provisions the two application roles
      # and is then used by nothing else - not the application, not the migrations. You should
      # definitely change the password in production.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-!ChangeMe!}
      POSTGRES_USER: ${POSTGRES_USER:-app}
      # Read by the initialization script below. The owner role owns the schema and runs migrations;
      # the runtime role has data rights only. See reference/adr/0030.
      OBOL_DB_OWNER: ${OBOL_DB_OWNER:-obol_owner}
      OBOL_DB_OWNER_PASSWORD: ${OBOL_DB_OWNER_PASSWORD:-!ChangeMe!}
      OBOL_DB_RUNTIME: ${OBOL_DB_RUNTIME:-obol_app}
      OBOL_DB_RUNTIME_PASSWORD: ${OBOL_DB_RUNTIME_PASSWORD:-!ChangeMe!}
    healthcheck:
      test: ["CMD", "pg_isready", "-d", "${POSTGRES_DB:-app}", "-U", "${POSTGRES_USER:-app}"]
      timeout: 5s
      retries: 5
      start_period: 60s
    volumes:
      - ./docker/db/data:/var/lib/postgresql/data:rw
      # Provisions the two application roles. The image runs this only against an empty data
      # directory, which is exactly once per cluster - so it is also mounted (rather than copied in)
      # to stay the single artifact `mise run db:roles` re-runs against a cluster that already exists,
      # such as one restored from a dump.
      - ./docker/db/init:/docker-entrypoint-initdb.d:ro
  ###< doctrine/doctrine-bundle ###

# Mercure is installed as a Caddy module, prevent the Flex recipe from installing another service
###> symfony/mercure-bundle ###
###< symfony/mercure-bundle ###

# No top-level volumes: each overlay declares its own - the development mounts in
# compose.dev.yaml, the database's in compose.prod.yaml.
