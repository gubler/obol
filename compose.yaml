---
x-database-url: &database_url postgresql://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-!ChangeMe!}@database:5432/${POSTGRES_DB:-app}?serverVersion=${POSTGRES_VERSION:-16}&charset=${POSTGRES_CHARSET:-utf8}

services:
  php:
    image: ${IMAGES_PREFIX:-}obol-php
    restart: unless-stopped
    environment:
      SERVER_NAME: ${SERVER_NAME:-obol.lolly.localhost}, php:80
      DEFAULT_URI: https://${SERVER_NAME:-obol.lolly.localhost}
      MERCURE_PUBLISHER_JWT_KEY: ${CADDY_MERCURE_JWT_SECRET:-!ChangeThisMercureHubJWTSecretKey!}
      MERCURE_SUBSCRIBER_JWT_KEY: ${CADDY_MERCURE_JWT_SECRET:-!ChangeThisMercureHubJWTSecretKey!}
      DATABASE_URL: *database_url
      MERCURE_URL: ${CADDY_MERCURE_URL:-http://php/.well-known/mercure}
      MERCURE_PUBLIC_URL: ${CADDY_MERCURE_PUBLIC_URL:-https://${SERVER_NAME:-obol.lolly.localhost}/.well-known/mercure}
      MERCURE_JWT_SECRET: ${CADDY_MERCURE_JWT_SECRET:-!ChangeThisMercureHubJWTSecretKey!}
    volumes:
      - caddy_data:/data
      - caddy_config:/config
      - uploads_data:/app/public/uploads
    depends_on:
      database:
        condition: service_healthy

  # Long-running Messenger consumer for the Symfony Scheduler transport. Without it the daily
  # GeneratePayments schedule never fires. Same image as php, different command; it waits for php
  # to be healthy so vendor install and migrations (run by php's entrypoint) are already done,
  # which makes its own entrypoint setup a no-op and avoids racing php on first boot.
  worker:
    image: ${IMAGES_PREFIX:-}obol-php
    restart: unless-stopped
    command: php bin/console messenger:consume scheduler_default --time-limit=3600
    # The image healthcheck probes the Caddy admin endpoint, which this command does not serve.
    healthcheck:
      disable: true
    environment:
      DATABASE_URL: *database_url
    depends_on:
      database:
        condition: service_healthy
      php:
        condition: service_healthy

  ###> doctrine/doctrine-bundle ###
  database:
    image: postgres:${POSTGRES_VERSION:-16}-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-app}
      # You should definitely change the password in production
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-!ChangeMe!}
      POSTGRES_USER: ${POSTGRES_USER:-app}
    healthcheck:
      test: ["CMD", "pg_isready", "-d", "${POSTGRES_DB:-app}", "-U", "${POSTGRES_USER:-app}"]
      timeout: 5s
      retries: 5
      start_period: 60s
    volumes:
      - ./docker/db/data:/var/lib/postgresql/data:rw
  ###< doctrine/doctrine-bundle ###

# Mercure is installed as a Caddy module, prevent the Flex recipe from installing another service
###> symfony/mercure-bundle ###
###< symfony/mercure-bundle ###

volumes:
  caddy_data:
  caddy_config:
  uploads_data:
###> symfony/mercure-bundle ###
###< symfony/mercure-bundle ###
