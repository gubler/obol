doctrine:
    dbal:
        # IMPORTANT: You MUST configure your server version,
        # either here or in the DATABASE_URL env var (see .env file)
        #server_version: '16'

        types:
            citext: App\Doctrine\Type\CitextType
            calendar_date: App\Doctrine\Type\CalendarDateType

        default_connection: default

        # Two connections, two database roles (reference/adr/0030). `default` is what the whole
        # application runs on and it cannot change the schema; `migrations` is the role that owns it.
        # Declared here rather than swapped into DATABASE_URL around the migration command, so a
        # human running doctrine:migrations:migrate by hand gets the owner role automatically instead
        # of a permission error in the middle of an incident.
        connections:
            default: &connection
                url: '%env(resolve:DATABASE_URL)%'

                profiling_collect_backtrace: '%kernel.debug%'

                # Map PostgreSQL SQL types back to our custom Doctrine types during schema introspection so
                # doctrine:migrations:diff does not propose spurious changes. Mapping `date` to calendar_date
                # makes every DATE column hydrate as a CalendarDate (ObligationSnapshot.recordedAt and
                # ExchangeRate.asOf included), which is why the swap has to be atomic. See ADR-0021.
                mapping_types:
                    citext: citext
                    date: calendar_date

            # Merged from `default` so the two can only ever differ by the credential. That is not
            # tidiness: `diff` reads the schema through this connection and the entity mapping through
            # the other, so a mapping_types entry on one and not the other would make it propose
            # changes that do not exist.
            migrations:
                <<: *connection
                url: '%env(resolve:MIGRATION_DATABASE_URL)%'
    orm:
#        auto_generate_proxy_classes: true
#        enable_lazy_ghost_objects: true
#        report_fields_where_declared: true
        validate_xml_mapping: true
        naming_strategy: doctrine.orm.naming_strategy.underscore_number_aware
        identity_generation_preferences:
            Doctrine\DBAL\Platforms\PostgreSQLPlatform: identity
        auto_mapping: true
        # Postgres `value AT TIME ZONE zone`, exposed to DQL so owner-scoped finders can resolve a
        # user's local date in SQL (payment generation keys off it; see ADR-0016).
        dql:
            datetime_functions:
                at_time_zone: App\Doctrine\Query\AtTimeZoneFunction
        mappings:
            App:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Entity'
                prefix: 'App\Entity'
                alias: App
            # Doctrine embeddables (e.g. the Money value object) live alongside the domain value
            # objects, not under Entity; register that namespace so their mapping is discovered.
            AppValueObject:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/ValueObject'
                prefix: 'App\ValueObject'
                alias: AppValueObject
        controller_resolver:
            auto_mapping: false

when@test:
    doctrine:
        dbal:
            # "TEST_TOKEN" is typically set by ParaTest. Both connections carry it: the suite's
            # database is created and migrated through `migrations` and read through `default`, so a
            # suffix on one of them would point the two at different databases.
            connections:
                default:
                    dbname_suffix: '_test%env(default::TEST_TOKEN)%'
                migrations:
                    dbname_suffix: '_test%env(default::TEST_TOKEN)%'

when@prod:
    doctrine:
        orm:
            query_cache_driver:
                type: pool
                pool: doctrine.system_cache_pool
            result_cache_driver:
                type: pool
                pool: doctrine.result_cache_pool

    framework:
        cache:
            pools:
                # The application pool is database-backed, so this result cache would store query
                # results in the database it is caching queries from. Inert today - nothing calls
                # enableResultCache(), so the pool is never written - but anything that starts using
                # it should move this to cache.system first, or the cache costs the round trip it is
                # meant to save.
                doctrine.result_cache_pool:
                    adapter: cache.app
                doctrine.system_cache_pool:
                    adapter: cache.system
