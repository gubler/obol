# see https://symfony.com/doc/current/reference/configuration/framework.html
framework:
    secret: '%env(APP_SECRET)%'

    # Note that the session will be started ONLY if you read or write from it.
    session:
        # Sessions live in PostgreSQL, not on the container filesystem. The production image declares
        # no volume for var/, so a file-backed session would die with its container and every deploy
        # would sign everyone out - landing them back on the remember-me cookie, which
        # silently downgrades whatever authentication produced the session (a passkey assertion
        # becomes a cookie). Symfony recognises a DSN here and routes it through
        # SessionHandlerFactory, which builds a PdoSessionHandler on its own lazy PDO connection -
        # deliberately not the ORM's. The handler's default transactional locking holds a row lock
        # for the life of the request, and sharing that with the request's business transaction would
        # make each block the other. The `sessions` table is owned by a migration.
        handler_id: '%env(resolve:DATABASE_URL)%'

        # Pin the SameSite policy explicitly rather than leaning on Symfony's default. Lax lets the
        # session cookie ride top-level GET navigations (magic-link and email-verify links arrive that
        # way) while withholding it from cross-site POSTs - defense in depth behind the CSRF tokens.
        cookie_samesite: lax

        # PHP's own default, kept deliberately rather than by omission. This number is not
        # load-bearing in either direction, which is the reason to leave it alone rather than an
        # excuse for not deciding.
        #
        # It does not govern how often anyone signs in: no cookie_lifetime is set, so the session
        # cookie already dies on browser close, and the rolling remember-me cookie is what carries a
        # returning user back in. Nor can raising it protect the authentication that produced the
        # session - under always_remember_me the downgrade to a cookie is inevitable at every value,
        # and a longer horizon only postpones it. The fix for that is requiring a fresh proof at the
        # point of use, not a bigger number here.
        #
        # Setting cookie_lifetime to extend a session past a browser restart is a trap worth naming:
        # PHP emits Set-Cookie only when it creates the session id, so a session cookie's lifetime
        # runs from login and never from last use. It cannot express an idle horizon, only a fixed
        # cliff that fires however active the user has been. See reference/adr/0028.
        gc_maxlifetime: 1440

    #esi: true
    #fragments: true

when@dev:
    framework:
        # Behind the Lolly dev proxy, TLS is terminated at the proxy and the app is reached over
        # HTTP, so Symfony saw the request as insecure and built the web debug toolbar's
        # X-Debug-Token-Link as http:// - which the https:// page blocked as mixed content, leaving
        # the toolbar stuck on "Loading". Trust the proxy (it sits on a private network) and honour
        # its X-Forwarded-* headers so the original https scheme is detected. Dev-only; prod has no
        # such proxy in front of FrankenPHP.
        trusted_proxies: 'private_ranges'
        trusted_headers: ['x-forwarded-for', 'x-forwarded-host', 'x-forwarded-proto', 'x-forwarded-port', 'x-forwarded-prefix']

when@prod:
    framework:
        # Behind the Cloudflare Tunnel connector, TLS terminates at Cloudflare and the app is reached
        # over plain HTTP from the connector container. Without trusting it, Symfony would see every
        # request as insecure - building http:// absolute URLs, and recording the connector's own
        # address as the client IP, which would collapse rate limiting onto a single bucket.
        #
        # Private ranges rather than a Cloudflare IP list: the production stack publishes no ports, so
        # the connector on the internal Docker network is the only thing that can reach the app at
        # all. That makes this both correct and self-maintaining - there is no upstream address list
        # to track and nothing to drift.
        #
        # X-Forwarded-For is only trustworthy alongside a Cloudflare Transform Rule that overwrites it
        # with the connecting IP, so a client-supplied header cannot influence what the app records.
        trusted_proxies: 'private_ranges'
        # Deliberately narrower than dev: host and prefix are not forwarded by anything upstream, and
        # trusting them would open a host-header poisoning seam for no benefit.
        trusted_headers: ['x-forwarded-for', 'x-forwarded-proto', 'x-forwarded-port']

when@test:
    framework:
        test: true
        session:
            # Mock file storage bypasses session.handler entirely, so the database-backed handler is
            # inert here and never opens its connection. handler_id is deliberately left in place
            # rather than nulled, so the container builds the same handler the other environments do
            # and the wiring stays assertable. Note the handler's DSN is the raw DATABASE_URL, which
            # knows nothing about doctrine-bundle's `_test` dbname suffix - so schema tooling that
            # consults the handler must be run in dev, never with APP_ENV=test.
            storage_factory_id: session.storage.factory.mock_file
