framework:
    messenger:
        default_bus: command.bus
        buses:
            command.bus:
                middleware:
                    - dispatch_after_current_bus
                    - validation
                    - doctrine_transaction
            query.bus:
                middleware:
                    - dispatch_after_current_bus
                    - validation
            event.bus:
                middleware:
                    - dispatch_after_current_bus
                    - doctrine_transaction
