security:
    providers:
        # Resolves any verified UserEmail address (primary or secondary) to its User.
        app_user_provider:
            id: App\Security\MultiEmailUserProvider

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false
        main:
            lazy: true
            provider: app_user_provider
            entry_point: App\Security\LoginRedirectEntryPoint

            # Passwordless magic-link authentication. The signature covers id + primary email; the
            # link is checked at app_login_check and consumed by the native login_link authenticator.
            login_link:
                check_route: app_login_check
                check_post_only: false
                signature_properties: ['id', 'email']
                lifetime: '%app.login_link.lifetime_seconds%'
                provider: app_user_provider

            # Passkey (WebAuthn) login - an opt-in fast path; magic-link stays the always-available
            # floor. The webauthn security factory wires an assertion request + response controller to
            # the paths below. The handlers return JSON (not a 302): the Stimulus controller reads
            # `redirect` on success and surfaces `error` on failure. Registration lives on the
            # standalone /account/passkeys/* routes (webauthn.yaml controllers.creation); this block
            # only enables assertion (login).
            webauthn:
                success_handler: App\Security\PasskeyAuthSuccessHandler
                failure_handler: App\Security\PasskeyAuthFailureHandler
                authentication:
                    profile: default
                    routes:
                        options_path: /login/passkey/options
                        result_path: /login/passkey/result

            # Keep sessions alive across browser restarts. No tokensInvalidatedAt yet (server-side
            # force-logout is Stage 2), so the cookie signs on the primary email - a primary-email
            # change invalidates outstanding cookies.
            remember_me:
                secret: '%kernel.secret%'
                lifetime: 2592000 # 30 days
                path: /
                secure: auto
                samesite: lax
                signature_properties: ['email']
                always_remember_me: true

            logout:
                path: app_logout
                target: app_login

    # Note: Only the *first* access control that matches will be used.
    access_control:
        - { path: ^/login, roles: PUBLIC_ACCESS }
        - { path: ^/logout, roles: PUBLIC_ACCESS }
        # Non-prod login bypass for Panther browser tests (TestLoginAsController 404s outside dev/test).
        - { path: ^/_test, roles: PUBLIC_ACCESS }
        - { path: ^/, roles: ROLE_USER }

when@test:
    security:
        password_hashers:
            # By default, password hashers are resource intensive and take time. This is
            # important to generate secure password hashes. In tests however, secure hashes
            # are not important, waste resources and increase test times. The following
            # reduces the work factor to the lowest possible values.
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon
