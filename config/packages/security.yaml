security:
    providers:
        # Resolves any verified UserEmail address (primary or secondary) to its User.
        app_user_provider:
            id: App\Security\MultiEmailUserProvider

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false
        main:
            lazy: true
            provider: app_user_provider
            entry_point: App\Security\LoginRedirectEntryPoint

            # Passwordless magic-link authentication. The signature covers id + primary email; the
            # link is checked at app_login_check and consumed by the native login_link authenticator.
            #
            # Single-use, POST-consumed: the emailed link is a plain GET that renders a "Sign in"
            # interstitial (LoginCheckController), and only the interstitial's POST redeems the link.
            # A mail-scanner prefetch or browser preload issues a GET, which no longer burns the link -
            # only the human's explicit POST does. max_uses + used_link_cache then reject a replay of an
            # already-redeemed link within its lifetime.
            login_link:
                check_route: app_login_check
                check_post_only: true
                max_uses: 1
                used_link_cache: cache.login_link
                signature_properties: ['id', 'email']
                lifetime: '%app.login_link.lifetime_seconds%'
                provider: app_user_provider

            # Passkey (WebAuthn) login - an opt-in fast path; magic-link stays the always-available
            # floor. The webauthn security factory wires an assertion request + response controller to
            # the paths below. The handlers return JSON (not a 302): the Stimulus controller reads
            # `redirect` on success and surfaces `error` on failure. Registration lives on the
            # standalone /account/passkeys/* routes (webauthn.yaml controllers.creation); this block
            # only enables assertion (login).
            webauthn:
                success_handler: App\Security\PasskeyAuthSuccessHandler
                failure_handler: App\Security\PasskeyAuthFailureHandler
                authentication:
                    profile: default
                    routes:
                        options_path: /login/passkey/options
                        result_path: /login/passkey/result

            # This, not the session, is what keeps people signed in. The session cookie has no
            # lifetime of its own, so it dies on browser close and every restart lands here.
            #
            # The cookie is rolling: SignatureRememberMeHandler reissues it on every restore, so the
            # lifetime is an idle horizon - 45 days since the user was last here - not an absolute
            # one. That makes it insensitive to how often people actually use Obol, which we do not
            # know: only the longest gap between two visits matters, and 45 days clears a five-week
            # absence with room to spare.
            #
            # No tokensInvalidatedAt yet (server-side force-logout is Stage 2), so the cookie signs on
            # the primary email - a primary-email change invalidates outstanding cookies.
            remember_me:
                secret: '%kernel.secret%'
                lifetime: 3888000 # 45 days
                path: /
                secure: auto
                samesite: lax
                signature_properties: ['email']
                always_remember_me: true

            logout:
                path: app_logout
                target: app_login

    # Note: Only the *first* access control that matches will be used.
    #
    # The `allow_if` rules below are expressions rather than `roles:` lists on purpose. A `roles:` list
    # is an OR: RoleVoter grants on the first attribute the token carries, and the decision strategy is
    # affirmative, so `roles: [ROLE_ADMIN, IS_AUTHENTICATED_FULLY]` would let either one through - a
    # weaker rule than the plain role check, not a stronger one. Only an expression means "and".
    access_control:
        # The public front door: logged-out `/` renders the landing, logged-in `/` the dashboard. The
        # `$` anchors this to the root only, so every deeper route still falls to the ROLE_USER catch-all.
        - { path: ^/$, roles: PUBLIC_ACCESS }
        # The landing "sign up for updates" form posts here from anonymous visitors.
        - { path: ^/updates$, roles: PUBLIC_ACCESS }
        # The container healthcheck probes this from inside the container, where there is no session
        # to authenticate with. Behind the firewall it would answer 302-to-login while the database
        # was on fire, which is exactly the false healthy this endpoint exists to stop.
        - { path: ^/health$, roles: PUBLIC_ACCESS }
        - { path: ^/login, roles: PUBLIC_ACCESS }
        - { path: ^/logout, roles: PUBLIC_ACCESS }
        # The secondary-email verification link is clicked from the target mailbox, possibly on a device
        # where the user is not signed in. The signed URL is the authority, so the endpoint is public;
        # every other /account/emails route stays behind the firewall.
        - { path: '^/account/emails/[0-9A-HJKMNP-TV-Z]{26}/verify$', roles: PUBLIC_ACCESS }
        # Non-prod login bypass for Panther browser tests (TestLoginAsController 404s outside dev/test).
        - { path: ^/_test, roles: PUBLIC_ACCESS }
        # The operator surface. Above the ROLE_USER catch-all (first match wins), so every /app/admin
        # route demands ROLE_ADMIN: a signed-in non-admin gets 403, an anonymous visitor is sent to login.
        # It also demands full authentication, so a remember-me cookie alone cannot reach it.
        - { path: ^/app/admin, allow_if: "is_granted('ROLE_ADMIN') and is_fully_authenticated()" }
        # Credential management: adding and removing addresses and passkeys, promoting a primary, and
        # resending a verification. These are the actions that can take over the account, so they
        # demand a fresh proof - a cookie-restored session is refused and sent to re-prove (ADR-0014).
        #
        # Prefixes, not per-route rules, because the WebAuthn bundle owns the registration ceremony at
        # /app/account/passkeys/{options,result} (webauthn.yaml controllers.creation) and there is no
        # app class there to carry an attribute. The firewall is those two endpoints' only guard.
        #
        # Reading is deliberately left open: the lists live at /app/account/access, which falls to the
        # catch-all below. The public /account/emails/{id}/verify link is matched further up and is not
        # under /app, so it is untouched.
        - { path: ^/app/account/emails, allow_if: "is_granted('ROLE_USER') and is_fully_authenticated()" }
        - { path: ^/app/account/passkeys, allow_if: "is_granted('ROLE_USER') and is_fully_authenticated()" }
        - { path: ^/, roles: ROLE_USER }

when@test:
    security:
        password_hashers:
            # By default, password hashers are resource intensive and take time. This is
            # important to generate secure password hashes. In tests however, secure hashes
            # are not important, waste resources and increase test times. The following
            # reduces the work factor to the lowest possible values.
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon
