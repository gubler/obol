controllers:
    resource: ../src/Controller/
    type: attribute
    # The `/_test` login bypass (App\Controller\Test\*) is kept out of prod by omission: its route is
    # registered only under when@dev / when@test below, so in prod the route does not exist at all.
    # Belt-and-braces alongside TestLoginAsController's own runtime env guard.
    exclude: ../src/Controller/Test/

# Register the test-only controllers (the login bypass) only in the non-prod environments.
when@dev: &test_controllers
    test_controllers:
        resource:
            path: ../src/Controller/Test/
            namespace: App\Controller\Test
        type: attribute

when@test: *test_controllers
