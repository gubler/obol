# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    app.uploads_directory: '%kernel.project_dir%/public/uploads/logos'
    app.uploads_public_path: 'uploads/logos'
    # The day the week starts on, as a day-of-week ordinal: 0 = Sunday (US), 1 = Monday (ISO 8601).
    # Drives the "remaining this week" boundary; becomes locale/per-user later. See ADR-0010.
    app.week_start_day: 0
    # How long a magic-link login is valid, in seconds (15 minutes).
    app.login_link.lifetime_seconds: 900
    # How long a secondary-email verification link is valid, in seconds (24 hours). Longer than a login
    # link because the person may not open the mailbox they are adding right away.
    app.secondary_email.verify_ttl_seconds: 86400
    # How many accounts the admin user list shows per page.
    app.admin.users_per_page: 20

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'
        # These hold plain data or Doctrine-managed classes, never Symfony services: entities
        # (per-row), enums, value objects, form-backing DTOs, and the DBAL types / DQL functions
        # Doctrine instantiates itself (registered in doctrine.yaml, not injected). Leaving them in
        # the resource registers each as a shared service it never is, polluting the container and
        # tripping worker-mode audits. (Message/ stays in: its handlers are real services,
        # intermixed with the command/query DTOs.)
        exclude:
            - '../src/Entity/'
            - '../src/Enum/'
            - '../src/ValueObject/'
            - '../src/Dto/'
            - '../src/Doctrine/'

    # Needs an explicit definition because src/Doctrine/ is excluded above. Unlike the DBAL types and
    # DQL functions that exclusion is written for, this one is a real service - the migrations
    # dependency factory resolves it by id (see doctrine_migrations.yaml).
    App\Doctrine\Migrations\EntitySchemaProvider: ~

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones
