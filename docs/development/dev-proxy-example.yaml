# ABOUTME: Reference compose snippet for the shared dev-proxy (Traefik + mkcert wildcard cert).
# ABOUTME: Not consumed by Obol directly — copy into ~/Projects/dev-proxy/ and run once per host.
#
# Shared reverse proxy for local development. Put this at:
#   ~/Projects/dev-proxy/compose.yaml
#
# One-time setup:
#   brew install mkcert nss
#   mkcert -install
#   mkdir -p ~/Projects/dev-proxy/certs
#   mkcert -cert-file ~/Projects/dev-proxy/certs/wildcard.pem \
#          -key-file  ~/Projects/dev-proxy/certs/wildcard.key \
#          "*.localhost" "localhost"
#   echo 'tls /certs/wildcard.pem /certs/wildcard.key' > ~/Projects/dev-proxy/certs/traefik-tls.yaml  # see config below
#   cd ~/Projects/dev-proxy && docker compose up -d
#
# After that, any obol/tollo/etc. stack brought up via `mise run up` joins the dev-proxy
# network automatically and Traefik routes https://<SERVER_NAME>.localhost to it.
#
# To tear down: `docker compose down && docker network rm dev-proxy`. Removing the network
# will flip Obol's bin/dc wrapper into solo mode on next `mise run up`.

---
services:
  traefik:
    image: traefik:v3
    restart: unless-stopped
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=dev-proxy
      - --providers.file.filename=/config/dynamic.yaml
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --api.dashboard=true
    ports:
      - "80:80"
      - "443:443"
      - "127.0.0.1:8081:8080"  # dashboard at http://localhost:8081
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./certs:/certs:ro
      - ./config:/config:ro
    networks:
      - dev-proxy
    labels:
      traefik.enable: "true"
      traefik.http.routers.dashboard.rule: "Host(`proxy.localhost`)"
      traefik.http.routers.dashboard.service: api@internal
      traefik.http.routers.dashboard.entrypoints: websecure
      traefik.http.routers.dashboard.tls: "true"

networks:
  dev-proxy:
    name: dev-proxy

# Companion file at ~/Projects/dev-proxy/config/dynamic.yaml:
#
