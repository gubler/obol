[env]
# `bin/dc` wraps `docker compose`: it applies --env-file .env.local if present and
# auto-selects compose.solo.yaml (no proxy) or compose.shared.yaml (lolly network
# reachable) so the same commands work in both modes.
DC = "./bin/dc"
DC_EXEC = "./bin/dc exec -T php"

[tasks._ensure-up]
description = "Verify the php container is running"
hide = true
run = [
    "$DC ps --status running --services | grep -q '^php$' || { echo 'php container not running; run: mise run up' >&2; exit 1; }",
]

[tasks.up]
description = "Start the stack (auto-detects shared vs solo mode; reads .env.local if present)"
run = ["$DC up -d --wait"]

[tasks.down]
description = "Stop the stack"
run = ["$DC down"]

[tasks.dce]
description = "Run a command in the php container, e.g. mise run dce -- php bin/console"
depends = ["_ensure-up"]
run = "$DC_EXEC $@"

[tasks."lint:php"]
description = "PHP syntax check on changed files (host-side, needs git)"
run = [
    """
    files=$(git diff --cached --name-only --diff-filter=ACM -- '*.php' 2>/dev/null || git diff --name-only HEAD -- '*.php' 2>/dev/null)
    if [ -z "$files" ]; then
        echo "No PHP files to lint"
        exit 0
    fi
    errors=0
    for file in $files; do
        if [ -f "$file" ]; then
            php -l "$file" > /dev/null 2>&1
            if [ $? -ne 0 ]; then
                php -l "$file"
                errors=1
            fi
        fi
    done
    if [ $errors -ne 0 ]; then
        exit 1
    fi
    echo "PHP syntax check passed"
    """
]

[tasks."lint:yaml"]
description = "Lint YAML translation catalogs via Symfony's lint:yaml"
depends = ["_ensure-up"]
run = ["$DC_EXEC php bin/console lint:yaml translations"]

# Host-side: it needs the docker CLI to render the compose chain, but starts nothing and does not
# need the stack up. Not in CI - the Lint & Test job runs inside a container with no Docker socket.
[tasks."check:prod-compose"]
description = "Assert the production compose contract (renders the deploy chain; starts nothing)"
run = ["./bin/prod-compose-check"]

# Pure shell against stub binaries - no Docker, no database, no stack. That makes it the one
# container-shaped check CI can run, which matters because the behavior it pins (a failed migration
# stops the boot) is invisible from outside the container.
[tasks."check:entrypoint"]
description = "Assert the container entrypoint contract (drives it against stubs; starts nothing)"
run = ["./bin/entrypoint-check"]

[tasks.sa]
description = "Static Analysis via PHPStan"
depends = ["_ensure-up"]
run = ["$DC_EXEC php vendor/bin/phpstan --memory-limit=4G analyze"]

[tasks."sa:tests"]
description = "Static Analysis on tests/ via PHPStan (relaxed profile)"
depends = ["_ensure-up"]
run = ["$DC_EXEC php vendor/bin/phpstan --memory-limit=4G analyze -c phpstan-tests.neon"]

# memory_limit=512M: the full suite peaks close to the container's 128M PHP default (Xdebug plus the
# Form/validator/property-info reflection path is memory-hungry), so an unbumped run intermittently
# crosses the limit and dies with "Premature end of PHP process" - flaking the git hooks. 512M gives
# ample headroom while still catching a genuine runaway. Mirrors the coverage task's limit.
[tasks.test]
description = "Tests via PHPUnit"
depends = ["_ensure-up", "tailwind"]
run = ["$DC_EXEC php -d memory_limit=512M vendor/bin/phpunit"]

[tasks."test:v"]
description = "Tests via PHPUnit (testdox output)"
depends = ["_ensure-up", "tailwind"]
run = ["$DC_EXEC php -d memory_limit=512M vendor/bin/phpunit --testdox"]

[tasks.infection]
description = "Mutation testing via Infection (on-demand; NOT in `check` or CI). Defaults to the Unit suite."
depends = ["_ensure-up"]
# XDEBUG_MODE=coverage supplies the coverage driver Infection needs (no pcov in
# the image). memory_limit=-1 keeps the post-run temp-file cleanup from OOMing on
# the 128M CLI default. --initial-tests-php-options raises the limit again for the
# PHPUnit child process Infection spawns: the parent's -d does not reach it, so the
# child takes php.ini's 128M and the initial run dies partway through the Unit suite
# under coverage. --threads is capped at 4 on purpose: --threads=max exhausts the
# container file-descriptor limit under coverage and aborts the run.
# Mutation testing targets the Unit suite - Feature/Integration are slow, DB/HTTP
# bound, and unit-tested domain logic is the meaningful target. Pass extra flags
# through with `--`, e.g. `mise run infection -- --filter=Subscription.php`.
run = ["$DC exec -T -e XDEBUG_MODE=coverage php php -d memory_limit=-1 vendor/bin/infection --threads=4 --test-framework-options=--testsuite=Unit --initial-tests-php-options='-d memory_limit=-1'"]

[tasks.coverage]
description = "Run tests with coverage (min 70%)"
depends = ["_ensure-up", "tailwind"]
# PHPUnit has no native --min; bin/coverage-min.php enforces the threshold from the Clover report.
run = ["$DC_EXEC sh -c 'XDEBUG_MODE=coverage php -d memory_limit=512M vendor/bin/phpunit --coverage-clover var/coverage.xml && php bin/coverage-min.php var/coverage.xml 70'"]

[tasks."coverage:report"]
description = "Generate HTML coverage report under var/coverage/"
depends = ["_ensure-up", "tailwind"]
run = ["$DC_EXEC sh -c 'XDEBUG_MODE=coverage php vendor/bin/phpunit --coverage-html=var/coverage'"]

[tasks.cs]
description = "Code Style via PHP CS Fixer (fix)"
depends = ["_ensure-up"]
# --using-cache=no keeps local parity with CI; the cache has masked violations the cacheless CI run then caught.
run = ["$DC_EXEC php vendor/bin/php-cs-fixer fix --using-cache=no"]

[tasks."cs:check"]
description = "Code Style via PHP CS Fixer (check only)"
depends = ["_ensure-up"]
# --using-cache=no keeps local parity with CI; the cache has masked violations the cacheless CI run then caught.
run = ["$DC_EXEC php vendor/bin/php-cs-fixer check --diff --using-cache=no"]

[tasks."cs:twig"]
description = "Twig Code Style (fix)"
depends = ["_ensure-up"]
run = ["$DC_EXEC php vendor/bin/twig-cs-fixer fix"]

[tasks."cs:twig:check"]
description = "Twig Code Style (check only)"
depends = ["_ensure-up"]
run = ["$DC_EXEC php vendor/bin/twig-cs-fixer check"]

[tasks.rector]
description = "Refactoring via Rector"
depends = ["_ensure-up"]
run = ["$DC_EXEC php vendor/bin/rector"]

[tasks."rector:check"]
description = "Rector (dry-run; fails on drift)"
depends = ["_ensure-up"]
run = ["$DC_EXEC php vendor/bin/rector --dry-run"]

# Igor - worker-mode state audit. On-demand ONLY, like `infection`: it is a blocking CI gate but is
# NOT part of `check` or the git hooks, because each run must first regenerate the service map via
# `cache:clear` (the IgorPhpBundle CompilerPass only fires on clear, not warmup) - too heavy for the
# fast per-commit sprints. The Go binary self-downloads on first run. safe classes are in the
# committed baseline (igor-baseline.json); entities/enums/VOs/DTOs/Doctrine types are kept out of the
# container by the services.yaml exclude, not suppressed here. See docs/development/worker-mode.md.
[tasks.igor]
description = "Worker-mode state audit via Igor (Deep Audit; on-demand, not in check/hooks)"
depends = ["_ensure-up"]
run = ["$DC_EXEC sh -c 'php bin/console cache:clear --env=dev >/dev/null && vendor/bin/igor-php .'"]

[tasks.seed]
description = "Load fixtures (purges first, then seeds)"
depends = ["_ensure-up"]
run = ["$DC_EXEC php bin/console doctrine:fixtures:load --no-interaction"]

[tasks."seed:clear"]
description = "Drop schema, re-run migrations (no fixtures)"
depends = ["_ensure-up"]
run = [
    "$DC_EXEC php bin/console doctrine:database:drop --force --if-exists",
    "$DC_EXEC php bin/console doctrine:database:create",
    "$DC_EXEC php bin/console doctrine:migrations:migrate --no-interaction --all-or-nothing",
]

[tasks.tailwind]
description = "Build Tailwind CSS assets"
depends = ["_ensure-up"]
run = ["$DC_EXEC php bin/console tailwind:build"]

[tasks."tailwind:restart"]
description = "Restart the dev Tailwind watch sidecar"
run = [
    """
    $DC ps --status running --services 2>/dev/null | grep -q '^tailwind$' || { echo 'Tailwind watcher is not running. Start the stack first: mise run up' >&2; exit 0; }
    $DC restart tailwind
    """,
]

# Symfony AI Mate (#138) - dev-only MCP server, runs inside the php container. The
# AI client launches `mate serve` itself via .mcp.json; these tasks are for manual
# use and diagnostics. See docs/mate.md.
[tasks.mate]
description = "Start the Mate MCP server (stdio) in the php container"
depends = ["_ensure-up"]
run = ["$DC_EXEC php vendor/bin/mate serve --force-keep-alive"]

[tasks."mate:tools"]
description = "List the MCP tools Mate exposes (diagnostic)"
depends = ["_ensure-up"]
run = ["$DC_EXEC php vendor/bin/mate mcp:tools:list"]

[tasks."mate:discover"]
description = "Re-scan vendor for Mate extensions and refresh mate/extensions.php + AGENTS.md (run after adding/removing a Mate extension)"
depends = ["_ensure-up"]
run = ["$DC_EXEC php vendor/bin/mate discover"]

# JS toolchain (#133) - runs host-side via npm (Node), never in the php container.
# AssetMapper + importmap stay the runtime; this is dev/CI tooling only. Run
# `npm ci` once after pulling. Mirrors the PHP sa/test/cs trio.
[tasks."js:sa"]
description = "JS static analysis via tsc --checkJs"
run = ["npm run sa"]

[tasks."js:test"]
description = "JS unit tests via Vitest"
run = ["npm run test"]

[tasks."js:cs"]
description = "JS code style + lint via Biome (fix)"
run = ["npm run cs"]

[tasks."js:cs:check"]
description = "JS code style + lint via Biome (check only)"
run = ["npm run cs:check"]

[tasks.icons]
description = "Rasterize assets/icons/obol-coin.svg into the public/ PNG favicon set (host-side via sharp)"
run = ["npm run icons"]

[tasks.palette]
description = "Regenerate docs/src/content/docs/palette.md (light + dark token swatches) from assets/styles/app.css (host-side)"
run = ["npm run palette"]

[tasks.check]
description = "Run all checks: PHPStan (src + tests), tests, CS Fixer, Twig CS, Rector, the JS toolchain, and the prod compose and entrypoint contracts"
depends = ["lint:yaml", "check:prod-compose", "check:entrypoint", "sa", "sa:tests", "test", "cs", "cs:twig", "rector:check", "js:sa", "js:test", "js:cs"]

[tasks."docs:install"]
description = "Install dev-docs dependencies (one-time, after clone)"
dir = "docs"
run = "docker compose run --rm docs-builder sh -c 'corepack enable && pnpm install --frozen-lockfile'"

[tasks."docs:dev"]
description = "Run the dev-docs site with hot reload (http://localhost:4321/obol/)"
dir = "docs"
run = "docker compose run --rm -p 4321:4321 docs-builder sh -c 'corepack enable && pnpm dev --host 0.0.0.0'"

[tasks."docs:build"]
description = "Build the dev-docs site to docs/dist/ (Dockerized pnpm; runs the links validator)"
dir = "docs"
run = "docker compose run --rm docs-builder"

[tasks."docs:check"]
description = "Run astro check on the dev-docs (Zod schema + TS validation)"
dir = "docs"
run = "docker compose run --rm docs-builder sh -c 'corepack enable && pnpm check'"

[tasks."docs:preview"]
description = "Serve the built dev-docs dist/ locally for final review (http://localhost:4321/obol/)"
dir = "docs"
run = "docker compose run --rm -p 4321:4321 docs-builder sh -c 'corepack enable && pnpm preview --host 0.0.0.0'"

[tasks."docs:deploy"]
description = "Build and rsync the dev-docs to hex:/srv/docs/obol/"
depends = ["docs:build"]
run = "rsync -avz --delete docs/dist/ hex:/srv/docs/obol/"

# End-user docs site (Astro Starlight in docs-user/, published to docs.dev88.work/obol-user).
# Standalone from the dev docs; builds in its own Dockerized pnpm container.
[tasks."docs-user:install"]
description = "Install docs-user dependencies (one-time, after clone)"
dir = "docs-user"
run = "docker compose run --rm docs-builder sh -c 'corepack enable && pnpm install --frozen-lockfile'"

[tasks."docs-user:dev"]
description = "Run the docs-user site with hot reload (http://localhost:4322/obol-user/)"
dir = "docs-user"
run = "docker compose run --rm -p 4322:4321 docs-builder sh -c 'corepack enable && pnpm dev --host 0.0.0.0'"

[tasks."docs-user:build"]
description = "Build the docs-user site to docs-user/dist/ (Dockerized pnpm; runs the links validator)"
dir = "docs-user"
run = "docker compose run --rm docs-builder"

[tasks."docs-user:check"]
description = "Run astro check on the docs-user (Zod schema + TS validation)"
dir = "docs-user"
run = "docker compose run --rm docs-builder sh -c 'corepack enable && pnpm check'"

[tasks."docs-user:preview"]
description = "Serve the built docs-user dist/ locally for final review (http://localhost:4322/obol-user/)"
dir = "docs-user"
run = "docker compose run --rm -p 4322:4321 docs-builder sh -c 'corepack enable && pnpm preview --host 0.0.0.0'"

[tasks."docs-user:deploy"]
description = "Build and rsync the docs-user to hex:/srv/docs/obol-user/"
depends = ["docs-user:build"]
run = "rsync -avz --delete docs-user/dist/ hex:/srv/docs/obol-user/"
