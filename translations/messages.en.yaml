auth:
    login:
        title: Log in
        heading: Log in to Obol
        intro: Enter your email and we'll send you a link to sign in. No password needed.
        link_sent: If that account exists, check your email for a link to sign in.
        submit: Email me a link
        email:
            label: Email address
            placeholder: you@example.com
    email:
        login_link:
            subject: Your Obol sign-in link
            heading: Sign in to Obol
            body: Use the link below to sign in. You did not need a password.
            cta: Sign in to Obol
            expiry: This link expires %when%.
            ignore: If you did not request this, you can safely ignore this email.
    passkey:
        login:
            button: Sign in with a passkey
            error: We could not sign you in with a passkey. Try again or use a magic link.

onboarding:
    title: Welcome to Obol
    heading: Welcome to Obol
    intro: Let's set a couple of basics so everything reads the way you expect.
    form:
        display_name: What should we call you?
        display_name_placeholder: A name, a nickname, whatever you like
        currency: Your default currency
        timezone: Your timezone
        change_later: You can change your language, currency, or date formatting later in your account settings.
        submit: Get started

tour:
    footer:
        link: Take the tour
    welcome:
        heading: Want a quick tour?
        body: Take a 60-second walk through the essentials. You can start it again anytime from the link at the foot of your dashboard.
        start: Take the tour
        dismiss: No thanks
    step:
        subscriptions:
            title: Your subscriptions
            body: This is your dashboard - every subscription you track, with its next renewal and cost.
        add:
            title: Add a subscription
            body: Start here to track a new recurring payment.
        totals:
            title: What you are spending
            body: Your combined outlay, converted to your default currency.
        categories:
            title: Categories
            body: Group subscriptions - streaming, utilities, tools - to see where the money goes.
        reports:
            title: Reports
            body: Break your spending down over time and by category.
        theme:
            title: Light or dark
            body: Switch between light and dark whenever you like.

account:
    passkey:
        new:
            title: Add a passkey
            heading: Add a passkey
            intro: A passkey lets you sign in with your fingerprint, face, or device PIN instead of waiting for a magic-link email.
            submit: Add a passkey
            unsupported: This browser does not support passkeys. You can still sign in with a magic link.
            cancelled: Passkey setup was cancelled.
            generic_error: Something went wrong adding the passkey. Please try again.
            no_js: Adding a passkey needs JavaScript. You can still sign in with a magic link.
            https_note: Passkeys work only over a secure (HTTPS) connection.
            back: Back to your passkeys
        index:
            title: Your passkeys
            heading: Your passkeys
            intro: Passkeys are an optional fast sign-in. You can always fall back to a magic-link email.
            empty: You have not added any passkeys yet.
            just_registered: Passkey added. Rename it below if you like.
            created: 'Added %date%'
            last_used: 'last used %date%'
            never_used: never used
            add: Add a passkey
            back: Back to Obol
        name:
            label: Passkey name
        rename:
            submit: Rename
            success: Passkey renamed.
            invalid: That passkey name is not valid.
        revoke:
            submit: Remove
            confirm: 'Remove the passkey "%name%"? You will no longer be able to sign in with it.'
            success: Passkey removed.
            last_removed: Passkey removed. You have no passkeys left, so sign in with a magic-link email.
    email:
        index:
            title: Your email addresses
            heading: Your email addresses
            intro: Add a second address as a backup - a magic link to any verified address signs you in, so you are not locked out if you lose access to one mailbox.
            primary_badge: Primary
            verified_badge: Verified
            pending_badge: Pending verification
            added: 'Added %date%'
            empty_secondary: You have not added any other addresses yet.
            back: Back to Obol
        add:
            label: Add an email address
            placeholder: you@example.com
            submit: Send verification link
            invalid: That does not look like a valid email address.
        promote:
            submit: Make primary
            confirm: 'Make "%address%" your primary address? Other signed-in devices will need to sign in again.'
        remove:
            submit: Remove
            confirm: 'Remove "%address%" from your account?'
        resend:
            submit: Resend link
        flash:
            verify_sent: If that address is free, we have sent it a verification link. Check that inbox to confirm it.
            promoted: Primary address updated.
            removed: Address removed.
            resent: Verification link sent.
        error:
            verified_elsewhere: That address is already verified on another account.
            cannot_promote_unverified: Verify that address before making it your primary.
            already_primary: That address is already your primary.
            cannot_remove_primary: You cannot remove your primary address. Make another address primary first.
        verify:
            subject: Confirm your email address
            heading: Confirm your email address
            body: Confirm this address so it can be used to sign in to your Obol account.
            cta: Confirm this address
            expiry: 'This link expires %when%.'
            ignore: If you did not add this address, you can ignore this email.
        verified:
            title: Address confirmed
            heading: Address confirmed
            body: '%address% is now verified and can be used to sign in.'
            manage: Manage your addresses
            login: Sign in
        verify_error:
            title: Link problem
            heading: We could not confirm that address
            invalid: This confirmation link is invalid or has expired. Request a fresh one from your account.
            not_found: This confirmation link no longer points to an address on any account.
            verified_elsewhere: That address is already verified on another account.
            back: Back to sign in

