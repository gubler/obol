# ABOUTME: English base catalog for the `validation` domain (custom constraint messages).
# ABOUTME: Populated per-surface by the i18n child issues (#224-#227); keyed per ADR-0012.
subscription:
    validation:
        restart_renewal_future: The next renewal date must be in the future to restart automatic payments.

payment:
    validation:
        restart_renewal_required: Choose the next renewal date to restart automatic payments.
        renewal_future: The next renewal date must be in the future.

auth:
    login:
        email:
            not_blank: Enter your email address.
            invalid: Enter a valid email address.
            too_long: That email address is too long.

account:
    passkey:
        name:
            not_blank: Enter a name for this passkey.
            too_long: That passkey name is too long.
